# 注意：项目名保持不变。它决定 volume 名（campus-ai_pgdata），
# 改名会创建空 volume、导致已有数据「消失」。容器名是临时的，可以随便改。
name:   campus-ai

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: llm-gateway-db
    environment:
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: campus_pwd
      POSTGRES_DB: campus
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U campus -d campus"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: llm-gateway-redis
    command: ["redis-server","--appendonly","yes","--maxmemory","256mb","--maxmemory-policy","allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llm-gateway-app
    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql+psycopg://campus:campus_pwd@db:5432/campus
      REDIS_URL: redis://redis:6379/0

      ENV: prod
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
            uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
