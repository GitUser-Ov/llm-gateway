<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>SSE 流式测试</title>
  <style>
    body { font-family: system-ui, "Microsoft YaHei", sans-serif; max-width: 760px; margin: 40px auto; padding: 0 16px; }
    input, button { font-size: 15px; padding: 8px 10px; }
    #question { width: 60%; }
    #out { margin-top: 20px; padding: 16px; background: #f6f8fa; border-radius: 8px; white-space: pre-wrap; line-height: 1.8; min-height: 120px; }
    .err { color: #b00020; }
  </style>
</head>
<body>
  <h2>SSE 流式输出测试</h2>
  <p>
    API Key：<input id="key" placeholder="sk-campus-..." size="40" />
  </p>
  <p>
    <input id="question" placeholder="问点什么…" value="用 200 字介绍 RAG 的原理" />
    <button id="send">发送</button>
  </p>
  <div id="out">等待中…</div>
  <script>
    const $ = (id) => document.getElementById(id);
    $("send").onclick = async () => {
      const out = $("out");
      out.textContent = "";
      out.className = "";
      const resp = await fetch("/api/v1/chat/stream", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-API-Key": $("key").value.trim(),
        },
        body: JSON.stringify({ question: $("question").value, temperature: 0.7 }),
      });
      // 注意：流式请求失败时，状态码还是能拿到的（因为那是"流开始前"的错误）
      if (!resp.ok) {
        out.className = "err";
        out.textContent = "请求失败：" + resp.status + "\n" + (await resp.text());
        return;
      }
      const reader = resp.body.getReader();
      const decoder = new TextDecoder("utf-8");
      let buffer = "";
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        // SSE 消息之间用空行分隔
        const chunks = buffer.split("\n\n");
        buffer = chunks.pop();          // 最后一段可能不完整，留到下一轮
        for (const chunk of chunks) {
          const line = chunk.trim();
          if (!line.startsWith("data:")) continue;
          const payload = JSON.parse(line.slice(5).trim());
          if (payload.type === "delta") {
            out.textContent += payload.content;
          } else if (payload.type === "error") {
            out.className = "err";
            out.textContent += "\n[错误] " + payload.message;
          } else if (payload.type === "done") {
            out.textContent += "\n\n── 完成，消息 id=" + payload.message_id;
          }
        }
      }
    };
  </script>
</body>
</html>
